replicaCount: 1

image:
  repository: todo-chatbot/api-gateway
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 700m
    memory: 1Gi
  requests:
    cpu: 300m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Dapr annotations for the API Gateway
dapr:
  enabled: true
  appId: "api-gateway"
  appPort: 80 # The port your FastAPI app listens on
  appProtocol: "http"
  sidecarCpuLimit: "100m"
  sidecarMemoryLimit: "256Mi"
  config: "dapr-config" # Name of the Dapr configuration resource
  components:
    - name: "pubsub-kafka"
      type: "pubsub.kafka"
    - name: "statestore"
      type: "state.postgresql"
    - name: "kubernetes-secretstore"
      type: "secretstores.kubernetes"
