apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  DATABASE_URL: "your_database_url_here"
  BETTER_AUTH_SECRET: "your_better_auth_secret_here"
  GEMINI_API_KEY: "your_gemini_api_key_here"
  CEREBRAS_API_KEY: "your_cerebras_api_key_here"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  ALLOWED_ORIGINS: "*"
  BETTER_AUTH_URL: "http://localhost:3000"
  API_AUDIENCE: "http://localhost:8000"
  JWKS_URL: "http://frontend:80/api/auth/jwks"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "backend"
        dapr.io/app-port: "8000"
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: backend
        image: backend:phase5
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
