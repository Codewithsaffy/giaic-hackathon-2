apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-backend.fullname" . }}
  labels:
    {{- include "todo-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.env.databaseUrl | quote }}
  openai-api-key: {{ .Values.env.openaiApiKey | quote }}
  cerebras-api-key: {{ .Values.env.cerebrasApiKey | quote }}
  better-auth-secret: {{ .Values.env.betterAuthSecret | quote }}
