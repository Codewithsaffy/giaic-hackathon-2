[project]
name = "todo-chatbot-features"
version = "0.1.0"
description = "Intermediate & Advanced Todo Chatbot Features with Event-Driven Architecture and Dapr"
authors = [{ name = "Gemini AI", email = "gemini@google.com" }]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.2",
    "dapr-sdk>=1.10.0",
    "sqlmodel>=0.0.14",
    "asyncpg>=0.28.0",
    "kafka-python>=2.0.2", # Placeholder, more specific client might be chosen later
]
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"] # E203 whitespace before ':', W503 line break before binary operator
exclude = [".venv", "venv", "__pycache__", ".git", "dist"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]
